services:
  data-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../space-map-export:/usr/share/nginx/html:ro
      - ./infrastructure/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - DATA_SERVER_URL=http://data-server
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    depends_on:
      - data-server
