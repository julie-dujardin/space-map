services:
  data-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../space-map-export:/usr/share/nginx/html:ro
      - ./infrastructure/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  meili:
    image: getmeili/meilisearch:v1.21
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=dev-master-key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-dev-data:/meili_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - DATA_SERVER_URL=http://data-server
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    depends_on:
      - data-server
      - meili

volumes:
  meili-dev-data:
