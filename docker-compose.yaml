services:
  data-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../space-map-export:/usr/share/nginx/html:ro
      - ./infrastructure/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  meili:
    image: getmeili/meilisearch:v1.21
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=dev-master-key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-dev-data:/meili_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - DATA_SERVER_URL=http://data-server
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    depends_on:
      - data-server
      - meili

  # The SDK demo pages (`/demo.html`, `/flatmap.html`, `/panorama.html`), served from an origin
  # that is neither the app's nor the data's — which is how a host page sees
  # them. The bundle is built at start rather than watched: the demo exercises
  # the shipped script, not a dev server's module graph.
  #
  # The pages fetch from the data server through the host's published port, so
  # the browser reaches it at :8080 while the app in `frontend` uses the
  # internal name.
  sdk-demo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm build:sdk && pnpm preview:sdk --port 4173"
    ports:
      - "4173:4173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - data-server

volumes:
  meili-dev-data:
