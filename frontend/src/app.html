<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-title" content="Space Map" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Data origin for the preload script below: kept on this meta, not in the
		     script body, so the script's bytes — and its CSP hash — are env-independent. -->
		<meta name="sm:data-url" content="%sveltekit.env.PUBLIC_DATA_URL%" />
		<script>
			// Early resource hints for the data origin, mirroring DATA_BASE
			// ($lib/fetch/data-base) so the metadata + systems-global fetches can
			// overlap the JS bundle download and warm the cross-origin connection.
			// NOTE: editing this script changes its CSP hash — update svelte.config.js.
			(function () {
				try {
					var meta = document.querySelector('meta[name="sm:data-url"]');
					var url = (meta && meta.content) || '';
					var base = url || 'https://static.spacemap.co';
					var cross = /^https?:\/\//.test(base);
					var add = function (rel, href, as) {
						var l = document.createElement('link');
						l.rel = rel;
						l.href = href;
						if (as) l.as = as;
						// An as="fetch" preload needs crossorigin even same-origin: without
						// it the preload sits in a different credentials mode than fetch(),
						// so the browser discards it and downloads the file a second time.
						if (cross || as === 'fetch') l.crossOrigin = 'anonymous';
						document.head.appendChild(l);
					};
					if (cross) add('preconnect', base);
					add('preload', base + '/v1/metadata.json', 'fetch');
					add('preload', base + '/v1/systems/global.json', 'fetch');
					// Images load from a separate origin in prod; warm it too.
					var img = url || 'https://images.spacemap.co';
					if (/^https?:\/\//.test(img) && img !== base) add('preconnect', img);
				} catch (e) {}
			})();
		</script>
		<script>
			// Resolve theme + reduced-motion before first paint so a stored override
			// doesn't FOUC through the system preference. Mirrors the auto logic in
			// settings.svelte.ts; keep them in sync.
			(function () {
				try {
					var s = localStorage.getItem('space-map-settings');
					var stored = s ? JSON.parse(s) : {};
					var theme = stored.theme || 'auto';
					var dark =
						theme === 'dark' ||
						(theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
					var rm = stored.reducedMotion || 'auto';
					var reduce =
						rm === 'on' ||
						(rm === 'auto' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
					if (reduce) document.documentElement.classList.add('reduce-motion');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
