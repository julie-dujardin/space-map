<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>spacemap SDK — flat map demo</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #05070e;
				color: #e6e6e6;
				font:
					14px/1.45 system-ui,
					sans-serif;
			}
			#map {
				position: fixed;
				inset: 0;
			}
			#panel {
				position: fixed;
				top: 12px;
				left: 12px;
				width: 290px;
				max-height: calc(100% - 24px);
				overflow: auto;
				box-sizing: border-box;
				padding: 12px 14px;
				background: rgba(12, 14, 20, 0.86);
				border: 1px solid #2c2f3a;
				border-radius: 10px;
				backdrop-filter: blur(8px);
			}
			h1 {
				margin: 0 0 4px;
				font-size: 16px;
			}
			h1 small {
				font-weight: normal;
				color: #9aa;
			}
			h2 {
				margin: 14px 0 4px;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: #8b93a7;
			}
			p {
				margin: 6px 0;
			}
			label {
				display: block;
				margin: 8px 0 2px;
				color: #9aa;
				font-size: 12px;
			}
			select,
			input,
			button {
				font: inherit;
				color: inherit;
				background: #171a24;
				border: 1px solid #3a3e4d;
				border-radius: 6px;
				padding: 4px 8px;
				min-width: 0;
			}
			button {
				cursor: pointer;
			}
			.row {
				display: flex;
				gap: 6px;
				margin: 8px 0;
			}
			.row > * {
				flex: 1 1 0;
			}
			#projection,
			#body {
				width: 100%;
			}
			#layers label {
				display: flex;
				align-items: center;
				gap: 7px;
				margin: 3px 0;
				color: #dfe4ee;
				font-size: 13px;
			}
			#layers input {
				flex: none;
				width: auto;
				min-width: 0;
				accent-color: #6af;
			}
			code {
				color: #bcd;
			}
			.pages {
				margin: 0 0 6px;
				font-size: 12px;
				color: #9aa;
			}
			.pages a {
				color: #8cf;
			}
			#layers input[type='range'] {
				flex: 1 1 0;
				padding: 0;
			}
			#error {
				color: #f88;
			}
			#viewstate,
			#credits {
				font:
					12px/1.5 ui-monospace,
					monospace;
				color: #9fb0c9;
			}
			.demo-grid {
				fill: none;
				stroke: rgb(255 255 255 / 25%);
				stroke-width: 0.5;
			}
			#readout {
				font:
					12px/1.5 ui-monospace,
					monospace;
				color: #9fb0c9;
			}
			/* Drawings the demo adds, styled from the host page — the shapes take a
			   className through and are otherwise the host's to dress. */
			.demo-track {
				filter: drop-shadow(0 0 4px rgba(120, 200, 255, 0.6));
			}
			.demo-label {
				padding: 1px 6px;
				border: 1px solid #6af;
				border-radius: 10px;
				background: rgba(10, 20, 40, 0.85);
				color: #cfe6ff;
				font:
					11px/1.5 system-ui,
					sans-serif;
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<aside id="panel">
			<nav class="pages">
				<a href="index.html">index</a> · <a href="demo.html">3D</a> · <b>flat</b> ·
				<a href="panorama.html">panorama</a> · <a href="systemmap.html">system</a> ·
				<a href="all.html">all</a>
			</nav>
			<h1>spacemap flat map <small>demo</small></h1>
			<p id="error" hidden></p>

			<label for="body">Body</label>
			<select id="body">
				<option value="naif-399">Earth</option>
				<option value="naif-499">Mars</option>
				<option value="naif-301">the Moon</option>
				<option value="naif-299">Venus</option>
				<option value="naif-199">Mercury</option>
				<option value="naif-606">Titan</option>
				<option value="naif-502">Europa</option>
			</select>

			<label for="projection">Projection</label>
			<select id="projection"></select>

			<h2>View</h2>
			<p id="viewstate"></p>
			<div class="row">
				<button id="home" type="button">Reset view</button>
				<button id="zoomin" type="button">Zoom ×2</button>
			</div>

			<h2>Layers</h2>
			<div id="layers"></div>
			<div class="row">
				<button id="rasterlayer" type="button">Add a picture</button>
				<button id="vectorlayer" type="button">Add a 10° grid</button>
			</div>
			<label for="month">Month, for a surface that changes with the season</label>
			<input id="month" type="range" min="0" max="11" value="0" />
			<p id="credits"></p>

			<h2>Drawing</h2>
			<div class="row">
				<button id="track" type="button">Great circle</button>
				<button id="box" type="button">Box</button>
			</div>
			<div class="row">
				<button id="circle" type="button">Circle</button>
				<button id="pin" type="button">Pin</button>
			</div>
			<div class="row">
				<button id="polygon" type="button">Polygon</button>
				<button id="clear" type="button">Clear drawings</button>
			</div>

			<h2>Restrictions</h2>
			<div id="gestures"></div>
			<div class="row">
				<input id="minzoom" placeholder="min zoom" />
				<input id="maxzoom" placeholder="max zoom" />
			</div>
			<div class="row">
				<input id="minlon" placeholder="min lon" />
				<input id="maxlon" placeholder="max lon" />
			</div>
			<div class="row">
				<input id="minlat" placeholder="min lat" />
				<input id="maxlat" placeholder="max lat" />
			</div>
			<div class="row">
				<button id="applylimits" type="button">Apply limits</button>
				<button id="clearlimits" type="button">Clear limits</button>
			</div>
			<p><code id="limits"></code></p>

			<h2>Pointer</h2>
			<p id="readout">move over the map</p>
		</aside>

		<script type="module">
			import { createFlatMap, dateToJD, graticule, pathFor, PROJECTION_IDS } from './spacemap.js';

			// ?data=<export root> ?lang=<bcp47> ?body=<object id> ?projection=<id> ?nc=1
			// ?zoom= ?lat= ?lon= ?clip=<degrees>  the opening view
			// ?date=<iso>                         which monthly or dated picture
			// ?off=<layer ids>                    layers that open switched off
			// ?interactive=0 ?no=<gestures> ?coop=1
			const params = new URLSearchParams(location.search);
			const local = ['localhost', '127.0.0.1'].includes(location.hostname);
			const dataUrl = params.get('data') ?? (local ? 'http://localhost:8080' : null);

			const $ = (id) => document.getElementById(id);
			const fail = (e) => {
				$('error').textContent = String(e?.message ?? e);
				$('error').hidden = false;
			};

			const LABELS = {
				equirectangular: 'Equirectangular (plate carrée)',
				equalEarth: 'Equal Earth (equal-area)',
				mollweide: 'Mollweide (equal-area)',
				sinusoidal: 'Sinusoidal (equal-area)',
				robinson: 'Robinson (compromise)',
				orthographic: 'Orthographic (globe)',
				stereographic: 'Polar stereographic (globe)'
			};
			for (const id of PROJECTION_IDS) {
				const option = document.createElement('option');
				option.value = id;
				option.textContent = LABELS[id] ?? id;
				$('projection').append(option);
			}

			const options = { body: params.get('body') ?? 'naif-399' };
			if (dataUrl) options.dataUrl = dataUrl;
			if (params.has('lang')) options.locale = params.get('lang');
			if (params.has('projection')) options.projection = params.get('projection');
			for (const [param, key] of [
				['zoom', 'zoom'],
				['lat', 'centerLat'],
				['lon', 'centerLon'],
				['clip', 'clipAngle']
			]) {
				if (params.has(param)) options[key] = Number(params.get(param));
			}
			if (params.has('date')) options.jd = dateToJD(new Date(params.get('date')));
			const hidden = (params.get('off') ?? '').split(',').filter(Boolean);
			if (hidden.length) options.layers = Object.fromEntries(hidden.map((id) => [id, false]));
			if (params.get('interactive') === '0') options.interactive = false;
			if (params.get('coop') === '1') options.cooperativeGestures = true;
			const off = (params.get('no') ?? '').split(',').filter(Boolean);
			if (off.length) options.interactions = Object.fromEntries(off.map((g) => [g, false]));
			// ?nc=1 accepts the non-commercial maps' terms, as a commercial page could not.
			if (params.get('nc') === '1') options.includeNonCommercial = true;
			options.events = { error: (e) => fail(e) };

			let map;
			try {
				map = await createFlatMap({ container: $('map'), ...options });
			} catch (e) {
				fail(e);
				throw e;
			}
			// The map, for poking at from the console.
			globalThis.map = map;

			$('body').value = options.body;
			$('projection').value = map.viewState.projection;

			// Layers are whatever the body actually has: Earth ships clouds and
			// night lights, Mars neither. Rebuilt whenever that set changes.
			const drawLayers = (layers) => {
				$('layers').replaceChildren(
					...layers.map((layer) => {
						const box = document.createElement('input');
						box.type = 'checkbox';
						box.checked = layer.visible;
						box.onchange = () => map.setLayerVisible(layer.id, box.checked);
						const label = document.createElement('label');
						label.append(box, layer.label);
						if (layer.kind === 'raster') {
							const opacity = document.createElement('input');
							opacity.type = 'range';
							opacity.min = 0;
							opacity.max = 1;
							opacity.step = 0.05;
							opacity.value = 1;
							opacity.oninput = () => map.setLayerOpacity(layer.id, Number(opacity.value));
							label.append(opacity);
						}
						return label;
					})
				);
				$('credits').textContent = map.credits
					.map((credit) => credit.attribution ?? credit.organisation)
					.join(' · ');
			};
			drawLayers(map.layers);
			map.on('layerschange', drawLayers);

			// Layers of the page's own: a picture drawn here, and lines built from
			// the same helpers the map's own graticule uses.
			$('rasterlayer').onclick = () => {
				const canvas = document.createElement('canvas');
				canvas.width = 1024;
				canvas.height = 512;
				const g = canvas.getContext('2d');
				for (let x = 0; x < 12; x++) {
					for (let y = 0; y < 6; y++) {
						g.fillStyle = (x + y) % 2 ? 'rgb(58 123 255 / 40%)' : 'rgb(255 123 58 / 40%)';
						g.fillRect((x * 1024) / 12, (y * 512) / 6, 1024 / 12, 512 / 6);
					}
				}
				map.addRasterLayer({
					id: 'demo-picture',
					label: 'Demo picture',
					url: canvas.toDataURL('image/png'),
					credit: { organisation: 'this page', source: 'drawn on a canvas' }
				});
				$('rasterlayer').disabled = true;
			};
			$('vectorlayer').onclick = () => {
				map.addVectorLayer({
					id: 'demo-grid',
					label: 'Demo 10° grid',
					render(viewport, group) {
						for (const line of graticule(10)) {
							const d = pathFor(line, viewport, { stepDeg: 2 });
							if (!d) continue;
							const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
							path.setAttribute('d', d);
							path.setAttribute('class', 'demo-grid');
							group.append(path);
						}
					}
				});
				$('vectorlayer').disabled = true;
			};
			$('month').oninput = () => {
				map.setTime(dateToJD(new Date(Date.UTC(2024, Number($('month').value), 15))));
			};

			const showView = (view) => {
				$('viewstate').textContent =
					`centre ${view.centerLat.toFixed(1)}°, ${view.centerLon.toFixed(1)}° · zoom ${view.zoom.toFixed(2)}`;
			};
			showView(map.viewState);
			$('home').onclick = () => map.setView({ centerLat: 0, centerLon: 0, zoom: 1 });
			$('zoomin').onclick = () => map.setView({ zoom: map.viewState.zoom * 2 });

			$('projection').onchange = () => map.setProjection($('projection').value);
			$('body').onchange = async () => {
				try {
					await map.setBody($('body').value);
					$('error').hidden = true;
				} catch (e) {
					fail(e);
				}
			};

			// Every drawing is given in longitude and latitude, so it survives a
			// change of projection — switch below and the shapes come with it.
			$('track').onclick = () => {
				map.addPolyline({
					points: [
						{ lon: -74, lat: 41 },
						{ lon: -0.1, lat: 51.5 },
						{ lon: 139.7, lat: 35.7 }
					],
					// The short way over the sphere, not a straight line on the plane.
					interpolate: 'geodesic',
					color: '#7ec8ff',
					widthPx: 2.5,
					className: 'demo-track'
				});
			};
			$('box').onclick = () => {
				map.addBox({
					latMin: 0,
					latMax: 30,
					lonMin: -20,
					lonSpan: 60,
					color: '#ffd479',
					fill: 'rgb(255 212 121 / 22%)',
					widthPx: 1.5
				});
			};
			$('circle').onclick = () => {
				map.addCircle({
					center: { lon: 0, lat: 0 },
					radiusDeg: 25,
					color: '#9dffb0',
					fill: 'rgb(157 255 176 / 18%)',
					widthPx: 1.5
				});
			};
			$('pin').onclick = () => {
				const element = document.createElement('div');
				element.className = 'demo-label';
				element.textContent = 'here';
				map.addMarker({ at: { lon: 12.5, lat: 41.9 }, element, align: [0.5, 1] });
			};
			$('polygon').onclick = () => {
				map.addPolygon({
					points: [
						{ lon: 100, lat: -40 },
						{ lon: 150, lat: -30 },
						{ lon: 140, lat: 10 },
						{ lon: 110, lat: 0 }
					],
					interpolate: 'geodesic',
					color: '#ff9ad5',
					fill: 'rgb(255 154 213 / 20%)',
					dash: '6 4',
					widthPx: 1.5,
					interactive: true,
					onclick: () => fail('the polygon was clicked')
				});
			};
			$('clear').onclick = () => map.clearDrawings();

			// Restrictions. Each gesture is a handler with enable/disable/isEnabled;
			// the limits are one set, replaced whole, and they gate reader input
			// only — setView goes where it is told.
			for (const name of ['dragPan', 'scrollZoom', 'cooperativeGestures']) {
				const box = document.createElement('input');
				box.type = 'checkbox';
				box.checked = map[name].isEnabled();
				box.onchange = () => (box.checked ? map[name].enable() : map[name].disable());
				const label = document.createElement('label');
				label.append(box, ` ${name}`);
				$('gestures').append(label);
			}

			const showLimits = () => {
				$('limits').textContent = `limits ${JSON.stringify(map.getLimits())}`;
			};
			showLimits();
			const number = (id) => {
				const value = $(id).value.trim();
				return value === '' ? undefined : Number(value);
			};
			$('applylimits').onclick = () => {
				const limits = {
					minZoom: number('minzoom'),
					maxZoom: number('maxzoom'),
					minLon: number('minlon'),
					maxLon: number('maxlon'),
					minLat: number('minlat'),
					maxLat: number('maxlat')
				};
				for (const key of Object.keys(limits)) {
					if (limits[key] === undefined) delete limits[key];
				}
				map.setLimits(limits);
				showLimits();
			};
			$('clearlimits').onclick = () => {
				map.setLimits({});
				showLimits();
			};

			const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(2)}°${v >= 0 ? pos : neg}`;
			map.on('pointermove', (at) => {
				// Round-tripped through project(), to show the pixel it lands on.
				const px = at && map.project(at.lon, at.lat);
				$('readout').textContent = at
					? `${fmt(at.lat, 'N', 'S')}  ${fmt(at.lon, 'E', 'W')}` +
						(px ? `  → ${Math.round(px[0])}, ${Math.round(px[1])} px` : '')
					: 'off the map';
			});
			map.on('click', (at) => {
				if (!at) return;
				map.addMarker({ at });
			});
			map.on('viewchange', (view) => {
				showView(view);
				$('projection').value = view.projection;
			});
		</script>
	</body>
</html>
