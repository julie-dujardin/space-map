name = "space-map"
main = ".svelte-kit/cloudflare/_worker.js"
# The Cloudflare dashboard holds the variables. A deploy keeps them.
keep_vars = true
# The workers.dev host is outside the zone's WAF. Unset, a deploy turns it on.
workers_dev = false
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
