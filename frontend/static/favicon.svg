<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #000; }
    .stroke { stroke: #000; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #fff; }
      .stroke { stroke: #fff; }
    }
  </style>
  <defs>
    <mask id="gap">
      <rect width="256" height="256" fill="white" />
      <circle cx="228" cy="128" r="24" fill="black" />
    </mask>
  </defs>

  <circle cx="128" cy="128" r="30" class="fg"/>

  <g transform="rotate(-22 128 128)">
    <ellipse cx="128" cy="128" rx="100" ry="48"
             class="stroke" stroke-width="8" fill="none"
             mask="url(#gap)"/>

    <circle cx="228" cy="128" r="16" class="fg"/>
  </g>
</svg>
