server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_format json;
        # The SDK demo runs on its own origin.
        add_header Access-Control-Allow-Origin * always;
    }

    # Tile pyramids are stored apart from the export and published to their
    # own host; here one server answers for both.
    location /v1/tiles/ {
        root /usr/share/nginx/tiles;
        add_header Access-Control-Allow-Origin * always;
    }
}
