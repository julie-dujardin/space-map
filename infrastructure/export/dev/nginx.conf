server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_format json;
        # The SDK demo runs on its own origin.
        add_header Access-Control-Allow-Origin * always;
    }

    # The tile tree, which also holds the extrasolar export, is stored apart
    # from the export and published to its own host; here one server answers
    # for both. Extrasolar .gz files go out as octet-stream with no
    # Content-Encoding: the client decodes them.
    location ~ ^/v1/(tiles|x|dust|glow)/ {
        root /usr/share/nginx/tiles;
        add_header Access-Control-Allow-Origin * always;
    }
}
