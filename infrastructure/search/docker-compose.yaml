services:
  meili:
    image: getmeili/meilisearch:v1.21
    container_name: space-map-meili
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ${MEILI_DATA_HOST_DIR:-/srv/space-map/meili_data}:/meili_data
    expose:
      - "7700"
    networks:
      - search

  caddy:
    image: caddy:2.10
    container_name: space-map-search-caddy
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - VPN_CIDR=${VPN_CIDR}
    # Cloudflare handles TLS
    ports:
      - "9750:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - meili
    networks:
      - search

networks:
  search:

volumes:
  caddy_data:
  caddy_config:

configs:
  caddyfile:
    # Inlined so the stack deploys from Portainer without the file present on host.
    content: |
      :80 {
      	encode gzip

      	# CORS: reflect Origin only if it's in the allowlist. Multiple origins
      	# are joined with `|` to form an alternation regex.
      	@allowed_origin header_regexp Origin ^https?://({$ALLOWED_ORIGINS})(:\d+)?$
      	header @allowed_origin {
      		Access-Control-Allow-Origin "{http.request.header.Origin}"
      		Access-Control-Allow-Headers "Authorization,Content-Type,X-Meilisearch-Client"
      		Access-Control-Allow-Methods "GET,POST,OPTIONS"
      		Access-Control-Max-Age "86400"
      		Vary "Origin"
      		defer
      	}

      	@preflight method OPTIONS
      	respond @preflight 204

      	# Public surface: search endpoints + health probe.
      	@search {
      		path /indexes/*/search
      		path /multi-search
      		path /health
      	}
      	reverse_proxy @search meili:7700

      	# Admin surface: everything else (settings, tasks, keys, dumps, swap,
      	# metrics, raw document CRUD). VPN-only.
      	@vpn remote_ip {$VPN_CIDR}
      	reverse_proxy @vpn meili:7700

      	respond 403
      }
