services:
  meili:
    image: getmeili/meilisearch:v1.21
    container_name: space-map-meili
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ${MEILI_DATA_HOST_DIR:-/srv/space-map/meili_data}:/meili_data
    # Admin is Meili directly (master-key protected). Caddy proxies search only.
    ports:
      - "${MEILI_ADMIN_BIND_IP:-127.0.0.1}:9751:7700"
    networks:
      - search

  caddy:
    image: caddy:2.10
    container_name: space-map-search-caddy
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    # No host port: the only way in is the tunnel (TLS terminates at Cloudflare).
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - meili
    networks:
      - search

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: space-map-search-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - search

networks:
  search:

configs:
  caddyfile:
    # Inlined so the stack deploys from Portainer without the file present on host.
    content: |
      :80 {
      	encode gzip

      	# CORS: reflect Origin only if it's in the allowlist (pipe-separated).
      	# $$ escapes Compose interpolation so Caddy expands {$ALLOWED_ORIGINS}.
      	@allowed_origin header_regexp Origin ^https?://({$$ALLOWED_ORIGINS})(:\d+)?$
      	header @allowed_origin {
      		Access-Control-Allow-Origin "{http.request.header.Origin}"
      		Access-Control-Allow-Headers "Authorization,Content-Type,X-Meilisearch-Client"
      		Access-Control-Allow-Methods "GET,POST,OPTIONS"
      		Access-Control-Max-Age "86400"
      		Vary "Origin"
      		defer
      	}

      	# handle blocks are mutually exclusive and evaluated in order, so the
      	# catch-all 403 can't shadow the proxy (a bare `respond` would).
      	@preflight method OPTIONS
      	handle @preflight {
      		respond 204
      	}

      	# Public surface: search + per-index stats (catalog count) + health.
      	@public path /indexes/*/search /indexes/*/stats /multi-search /health
      	handle @public {
      		reverse_proxy meili:7700
      	}

      	# Everything else (settings, keys, tasks, dumps, CRUD) is not proxied —
      	# admin goes straight to Meili on :9751.
      	handle {
      		respond 403
      	}
      }
