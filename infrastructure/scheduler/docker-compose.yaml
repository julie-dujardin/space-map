services:
  data:
    image: ghcr.io/julie-dujardin/space-map-data:latest
    build:
      context: ../..
      dockerfile: infrastructure/scheduler/Dockerfile
    container_name: space-map-data
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Unset channels are skipped.
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN:-}
      - PUSHOVER_USER=${PUSHOVER_USER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      - SPACETRACK_IDENTITY=${SPACETRACK_IDENTITY:-}
      - SPACETRACK_PASSWORD=${SPACETRACK_PASSWORD:-}
    volumes:
      - ${CONFIG_HOST_PATH:-/srv/space-map/config.toml}:/app/data/config.toml:ro
      - ${DOWNLOADS_HOST_DIR:-/srv/space-map/space-map-downloads}:/space-map-downloads
      # Ingest database and metadata mirror. Regenerable, but it has to persist
      # across container recreation and stay on local disk — the downloads dir
      # is NFS, where SQLite WAL is unsupported.
      - ${CACHE_HOST_DIR:-/srv/space-map/space-map-cache}:/space-map-cache
