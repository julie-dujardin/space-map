[project]
name = "space-map-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx",
    "sqlalchemy>=2.0",
    "tqdm",
]

[project.scripts]
space-map-download = "space_map_data.download.__main__:cli"
space-map-ingest = "space_map_data.ingest.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
