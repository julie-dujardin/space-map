[project]
name = "space-map-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "sqlalchemy>=2.0",
    "tqdm",
]

[project.scripts]
space-map-data = "space_map_data.download:cli"
space-map-aggregate = "space_map_data.aggregate:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
