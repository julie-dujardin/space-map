[project]
name = "space-map-data"
version = "0.1.6"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx",
    "jplephem>=2.24",
    "meilisearch>=0.41.0",
    "openexr>=3.4.11",
    "orjson>=3.11.8",
    "pillow>=12.2.0",
    "py360convert>=1.0.4",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "spiceypy>=8.1.0",
    "sqlalchemy>=2.0",
    "tifffile>=2026.3.3",
    "tqdm",
]

[project.scripts]
space-map-download = "space_map_data.download.__main__:cli"
space-map-ingest = "space_map_data.ingest.__main__:cli"
space-map-export = "space_map_data.export.__main__:cli"
space-map-scheduler = "space_map_data.scheduler.__main__:main"
space-map-search = "space_map_data.search.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
