<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Map · Planetary panoramas</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; color: #f3ede7; background: #17191c; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    canvas { width: 100vw; height: 100dvh; display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #flat { position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: contain; padding: 40px 25px 100px 390px; }
    #flat[hidden] { display: none; }
    .panel { position: fixed; z-index: 2; background: #15171ce8; border: 1px solid #ffffff20; border-radius: 16px; backdrop-filter: blur(16px); box-shadow: 0 8px 40px #0003; }
    header { top: 20px; left: 20px; width: 330px; padding: 20px; }
    .eyebrow { color: #e7a37f; letter-spacing: .18em; font-size: 10px; text-transform: uppercase; }
    h1 { margin: 7px 0 18px; font-size: 23px; font-weight: 550; }
    label { display: block; margin: 12px 0 6px; color: #b8b5b1; font-size: 12px; }
    select, button { font: inherit; color: inherit; background: #ffffff0c; border: 1px solid #ffffff25; border-radius: 8px; padding: 9px 12px; }
    select { width: 100%; }
    option { background: #202226; }
    button { cursor: pointer; }
    button:hover { background: #ffffff20; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row button { flex: 1; }
    #details { line-height: 1.7; color: #b8b5b1; font-size: 12px; margin: 16px 0 0; }
    a { color: #edb598; }
    #compass { top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px; font-variant-numeric: tabular-nums; letter-spacing: .05em; }
    footer { bottom: 20px; left: 20px; padding: 13px 18px; max-width: calc(100vw - 40px); color: #c3bfba; font-size: 12px; line-height: 1.6; }
    #status { position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 14px 20px; background: #15171ce8; border-radius: 10px; text-align: center; }
    #status:empty { display: none; }
    #tools { right: 20px; bottom: 20px; display: flex; gap: 6px; padding: 8px; }
    @media (max-width: 700px) { #flat { padding: 390px 10px 110px; } }
    @media (max-width: 700px) { header { top: 10px; left: 10px; width: 260px; padding: 12px; } h1 { font-size: 18px; margin-bottom: 8px; } #details { margin-top: 8px; } #compass { top: 10px; right: 10px; left: auto; transform: none; padding: 10px; } footer { bottom: 70px; left: 10px; max-width: calc(100vw - 20px); } #tools { right: 10px; bottom: 10px; } }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Interactive planetary panorama. Drag to look, scroll to zoom, or use arrow keys."></canvas>
  <header class="panel">
    <div class="eyebrow">Space Map / Surface preview</div>
    <h1>Planetary panoramas</h1>
    <label for="mission">Collection</label>
    <select id="mission"><option value="perseverance">Perseverance · Navcam color</option><option value="mastcamz">Perseverance · Mastcam-Z color</option><option value="curiosity">Curiosity · Mastcam color</option><option value="pancam">Spirit & Opportunity · Pancam archive</option><option value="spirit">Spirit · NASA releases</option><option value="opportunity">Opportunity · NASA releases</option><option value="insight">InSight · Timeline</option><option value="phoenix">Phoenix · Panorama</option><option value="pathfinder">Pathfinder · Panorama</option></select>
    <label for="panorama">Mosaic / observation</label>
    <select id="panorama"></select>
    <div class="row"><button id="previous" aria-label="Previous panorama">← Previous</button><button id="next">Next →</button></div>
    <div id="details"></div>
  </header>
  <img id="flat" hidden alt="Archived color mosaic; angular projection is not yet verified">
  <div id="compass" class="panel" aria-label="View heading">N · 000°</div>
  <div id="status" role="status">Loading panoramas…</div>
  <footer class="panel">Drag to look · Scroll to zoom · Arrow keys to turn<br>Dark areas have no imagery. Archive grid marks and seams may remain.<br><span id="credit">Courtesy NASA/JPL-Caltech</span></footer>
  <div id="tools" class="panel"><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="reset">Face north</button><button id="fullscreen">Full screen</button></div>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const canvas = $('view'), status = $('status');
    let yaw = 0, pitch = -12, fov = 75, entries = [], request = 0, texture = null, orientationKnown = true;
    for (const [value, label] of [['curiosity-navcam', 'Curiosity · Navcam grayscale'], ['moon', 'Moon · Apollo panoramas'], ['venus', 'Venus · Venera grayscale'], ['titan', 'Titan · Huygens descent']]) $('mission').add(new Option(label, value));
    const initial = new URLSearchParams(location.search);
    if ([...$('mission').options].some(option => option.value === initial.get('collection'))) $('mission').value = initial.get('collection');
    const radians = Math.PI / 180;
    const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
    const vertex = `attribute vec2 point; void main() { gl_Position = vec4(point, 0., 1.); }`;
    const fragment = `precision highp float;
      uniform sampler2D panorama;
      uniform vec2 size;
      uniform float yaw, pitch, fov;
      void main() {
        vec2 screen = (gl_FragCoord.xy / size) * 2. - 1.;
        vec3 ray = normalize(vec3(screen.x * size.x / size.y * tan(fov / 2.), screen.y * tan(fov / 2.), 1.));
        ray = vec3(ray.x, ray.y * cos(pitch) + ray.z * sin(pitch), ray.z * cos(pitch) - ray.y * sin(pitch));
        ray = vec3(ray.x * cos(yaw) + ray.z * sin(yaw), ray.y, ray.z * cos(yaw) - ray.x * sin(yaw));
        vec2 uv = vec2(fract(atan(ray.x, ray.z) / 6.28318530718 + 1.), .5 - asin(clamp(ray.y, -1., 1.)) / 3.14159265359);
        vec4 color = texture2D(panorama, uv);
        gl_FragColor = vec4(mix(vec3(.065, .075, .085), color.rgb, color.a), 1.);
      }`;
    let program, uniforms;
    function shader(type, source) {
      const result = gl.createShader(type);
      gl.shaderSource(result, source); gl.compileShader(result);
      if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(result));
      return result;
    }
    function render() {
      if (!gl || !program || canvas.hidden) return;
      const ratio = Math.min(devicePixelRatio || 1, 2);
      const width = Math.round(canvas.clientWidth * ratio), height = Math.round(canvas.clientHeight * ratio);
      if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
      gl.viewport(0, 0, width, height);
      gl.uniform2f(uniforms.size, width, height);
      gl.uniform1f(uniforms.yaw, yaw * radians); gl.uniform1f(uniforms.pitch, pitch * radians); gl.uniform1f(uniforms.fov, fov * radians);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const heading = ((yaw % 360) + 360) % 360;
      const direction = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(heading / 45) % 8];
      $('compass').textContent = orientationKnown ? `${direction} · ${Math.round(heading) % 360}°` : `Relative view · ${Math.round(heading) % 360}°`;
    }
    async function json(url) { const response = await fetch(url); if (!response.ok) throw new Error(`Could not load ${url} (${response.status})`); return response.json(); }
    async function loadPanorama() {
      const token = ++request;
      status.textContent = 'Loading panorama…';
      $('details').textContent = '';
      try {
        const entry = entries[Number($('panorama').value)];
        const metadataURL = new URL(entry.metadata, location.origin);
        const data = await json(metadataURL);
        if (token !== request) return;
        const flat = !data.image;
        orientationKnown = data.orientation_status !== 'unknown';
        $('reset').textContent = orientationKnown ? 'Face north' : 'Reset view';
        canvas.hidden = flat; $('flat').hidden = !flat; $('compass').hidden = flat; $('tools').hidden = flat;
        $('credit').textContent = data.credit;
        const metrics = data.coverage;
        const horizontal = metrics?.horizontal_percent == null ? (metrics?.estimated_horizontal_degrees == null ? 'Horizontal coverage unknown' : `≈${metrics.estimated_horizontal_degrees.toFixed(0)}° / ≈${metrics.estimated_horizontal_percent.toFixed(0)}% horizontal (estimated)`) : `${metrics.horizontal_degrees.toFixed(1)}° / ${metrics.horizontal_percent.toFixed(1)}% horizontal`;
        const sphere = metrics?.sphere_percent == null ? (metrics?.estimated_sphere_percent == null ? 'Sphere coverage unknown' : `≈${metrics.estimated_sphere_percent.toFixed(1)}% sphere (estimated)`) : `${metrics.sphere_percent.toFixed(1)}% sphere coverage`;
        $('details').textContent = `${data.capture_time || data.start_time || 'Capture date unverified'}${data.capture_stop_time ? ' – ' + data.capture_stop_time : ''}\n${horizontal} · ${sphere}\n`;
        $('details').style.whiteSpace = 'pre-line';
        if (data.grid_geometry_status === 'estimated') $('details').append('Approximate grid-derived geometry; not validated\n');
        if (data.geometry_status === 'estimated') $('details').append((data.geometry_note || 'Approximate strip projection; vertical scale uncalibrated') + '\n');
        if (data.observation_type === 'descent') $('details').append(`Aerial descent view · ${data.observer_altitude_m.toLocaleString()} m altitude\n`);
        if (data.reuse?.note) $('details').append(data.reuse.note + '\n');
        if (!orientationKnown) $('details').append('North orientation unknown\n');
        if (data.position) $('details').append(`${data.position.latitude.toFixed(5)}° latitude · ${data.position.longitude.toFixed(5)}° E\n`);
        else $('details').append('Map position not yet verified\n');
        if (data.source_width) $('details').append(`Source: ${data.source_width.toLocaleString()} × ${data.source_height.toLocaleString()} px\n`);
        const link = document.createElement('a'); link.href = new URL(data.preview, metadataURL).href; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Open flat preview'; $('details').append(link);
        for (const [label, href] of [['Source', data.source_pages?.[0]], ['Reuse terms', data.reuse?.policy_url]]) {
          if (!href) continue;
          const sourceLink = document.createElement('a'); sourceLink.href = href; sourceLink.target = '_blank'; sourceLink.rel = 'noopener'; sourceLink.textContent = label;
          $('details').append(' · ', sourceLink);
        }
        if (flat) {
          $('flat').src = new URL(data.preview, metadataURL).href;
          await $('flat').decode();
          if (token !== request) return;
          $('details').append('\nFlat image: no assumed sphere projection.');
          if (data.interesting_reasons?.length) $('details').append('\n' + data.interesting_reasons.join('; '));
          status.textContent = '';
          return;
        }
        if (metrics?.horizontal_degrees != null && metrics.horizontal_degrees < 359) {
          const bounds = data.projection_bounds || data.source_coverage;
          const start = bounds?.start_azimuth_deg ?? bounds?.azimuth_start_deg;
          if (start != null) yaw = start + metrics.horizontal_degrees / 2;
          const top = bounds?.elevation_top_deg ?? bounds?.elevation_max_deg;
          const bottom = bounds?.elevation_bottom_deg ?? bounds?.elevation_min_deg;
          if (top != null && bottom != null) pitch = Math.max(-89, Math.min(89, (top + bottom) / 2));
          fov = Math.max(30, Math.min(75, metrics.horizontal_degrees));
        } else { yaw = 0; pitch = -12; fov = 75; }
        if (data.initial_view) { yaw = data.initial_view.yaw; pitch = data.initial_view.pitch; }
        const image = new Image();
        image.src = new URL(data.image, metadataURL).href;
        await image.decode();
        if (token !== request) return;
        if (image.width > gl.getParameter(gl.MAX_TEXTURE_SIZE)) throw new Error('This device needs smaller panorama textures. Reprocess with --width 2048.');
        const next = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, next);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        if (texture) gl.deleteTexture(texture);
        texture = next;
        status.textContent = ''; render();
      } catch (error) { if (token === request) status.textContent = error.message; }
    }
    async function loadMission() {
      const token = ++request;
      status.textContent = 'Loading locations…';
      try {
        const data = await json(`/${$('mission').value}/catalog.json`);
        if (token !== request) return;
        entries = data.panoramas.sort((a, b) => Number(Boolean(b.sphere_ready)) - Number(Boolean(a.sphere_ready)));
        $('panorama').replaceChildren(...entries.map((entry, index) => new Option(`${entry.title || 'Sol ' + entry.sol} · ${index + 1} of ${entries.length}`, index)));
        if (!entries.length) throw new Error('No panoramas in this catalog.');
        const selected = entries.findIndex(entry => entry.id === initial.get('panorama'));
        if (selected >= 0) $('panorama').value = selected;
        await loadPanorama();
      } catch (error) { if (token === request) status.textContent = error.message; }
    }
    let drag = null;
    canvas.addEventListener('pointerdown', (event) => { canvas.focus(); canvas.setPointerCapture(event.pointerId); drag = { x: event.clientX, y: event.clientY, yaw, pitch }; });
    canvas.addEventListener('pointermove', (event) => { if (!drag) return; const scale = fov / canvas.clientHeight; yaw = drag.yaw - (event.clientX - drag.x) * scale; pitch = Math.max(-89, Math.min(89, drag.pitch + (event.clientY - drag.y) * scale)); render(); });
    for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(event, () => { drag = null; });
    function zoom(delta) { fov = Math.max(30, Math.min(105, fov + delta)); render(); }
    canvas.addEventListener('wheel', (event) => { event.preventDefault(); zoom(Math.sign(event.deltaY) * 4); }, { passive: false });
    canvas.addEventListener('keydown', (event) => { if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '+', '-', '='].includes(event.key)) return; event.preventDefault(); if (event.key === 'ArrowLeft') yaw -= 5; if (event.key === 'ArrowRight') yaw += 5; if (event.key === 'ArrowUp') pitch = Math.min(89, pitch + 5); if (event.key === 'ArrowDown') pitch = Math.max(-89, pitch - 5); if (event.key === '+' || event.key === '=') zoom(-5); if (event.key === '-') zoom(5); render(); });
    $('mission').onchange = loadMission; $('panorama').onchange = loadPanorama;
    function step(delta) { if (!entries.length) return; $('panorama').value = (Number($('panorama').value) + delta + entries.length) % entries.length; loadPanorama(); }
    $('previous').onclick = () => step(-1); $('next').onclick = () => step(1);
    $('zoom-in').onclick = () => zoom(-10); $('zoom-out').onclick = () => zoom(10);
    $('reset').onclick = () => { yaw = 0; pitch = -12; fov = 75; render(); };
    $('fullscreen').onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (error) { status.textContent = error.message; } };
    window.addEventListener('resize', render);
    canvas.addEventListener('webglcontextlost', (event) => { event.preventDefault(); status.textContent = 'Graphics context lost. Reload this page to continue.'; });
    try {
      if (!gl) throw new Error('WebGL is unavailable. Enable hardware acceleration to view panoramas.');
      program = gl.createProgram(); gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex)); gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment)); gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      gl.useProgram(program);
      uniforms = Object.fromEntries(['size', 'yaw', 'pitch', 'fov'].map((name) => [name, gl.getUniformLocation(program, name)]));
      const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const point = gl.getAttribLocation(program, 'point'); gl.enableVertexAttribArray(point); gl.vertexAttribPointer(point, 2, gl.FLOAT, false, 0, 0);
      await loadMission();
    } catch (error) { status.textContent = error.message; }
  </script>
</body>
</html>
