# `organisation` is the compact chip label in the attribution bar, where credits
# dedupe by exact string — so it names the umbrella body (NASA, ESA) rather than
# the specific node or collaboration. `attribution` carries the full credit and
# is what /credits and the popover render.
#
# `distribution` says who may serve the map, in three tiers. Absent is the
# common one: free to publish anywhere, and we credit it either way — whether
# the licence compels attribution makes no difference to what we render.
# `non-commercial` is a licence that forbids commercial reuse, so an embed
# opts into it. `site-only` is cleared for spacemap.co alone and reaches no
# embed at all, whatever it opts into.
#
# `preference` (default 0) ranks the maps of one body by how good they are —
# a judgement about the picture, never about its rights. The best one exports
# to `textures/<body>/`; the rest need a `variant` slug and export beside it as
# `textures/<body>_alt-<variant>/`, so a viewer that may not serve the best one
# still has a map to draw. `skip: true` is the other thing: never process it.
