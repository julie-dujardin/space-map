# Galaxies, their groups and clusters, and the large-scale structure.
# `constants/manifests/catalogues.py` describes the fields.
catalogues:
- key: lvdb
  title: Local Volume Database, v1.1.1
  reference: Pace 2025, OJAp 8, 142
  license: >-
    CC0 1.0 (Zenodo licence field, repository LICENSE). "If you use this in
    your research please cite the overview paper and include a link to the
    github repository (https://github.com/apace7/local_volume_database)."
  terms_url: https://zenodo.org/records/21910097
  distribution: open
  zenodo:
    record: 21910097
  urls:
  - https://github.com/apace7/local_volume_database/releases/download/v1.1.1/comb_all.csv

# The site writes a table file again only when its table form is posted, so a
# plain fetch cannot refresh it.
- key: lvg
  title: Catalog and Atlas of the Local Volume Galaxies
  reference: Karachentsev, Makarov & Kaisina 2013, AJ 145, 101
  license: None stated. The site asks for no credit.
  terms_url: https://www.sao.ru/lv/lvgdb/introduction.php
  distribution: undecided
  urls:
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table1.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table2.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table3.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table4.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table5.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table6.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table7.dat
  - https://www.sao.ru/lv/lvgdb/tables/lvg_table8.dat

- key: hecate
  title: Heraklion Extragalactic Catalogue (HECATE)
  reference: Kovlakas et al. 2021, MNRAS 506, 1896
