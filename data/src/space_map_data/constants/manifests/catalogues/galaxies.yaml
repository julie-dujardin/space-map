    "License: CC-BY-4.0". Derived from HyperLEDA ("All the data and the
    software is publicly available in open-source for non-commercial
    purposes").
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/MNRAS/506/1896/ReadMe
  distribution: non-commercial
  cds:
    catalogue: J/MNRAS/506/1896
    files: [hecate.dat.gz]

- key: cosmicflows-4
  title: Cosmicflows-4
  reference: Tully et al. 2023, ApJ 944, 94
