# Black holes, X-ray binaries, active galaxies, and gravitational-wave events.
# `constants/manifests/catalogues.py` describes the fields.
catalogues:
- key: van-den-bosch-2016
  title: Unification of the fundamental plane and supermassive black hole masses
  reference: van den Bosch 2016, ApJ 831, 134
  license: None stated.
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/ApJ/831/134/ReadMe
  distribution: undecided
  cds:
    catalogue: J/ApJ/831/134
    files: [table2.dat, table3.dat, table4.dat, refs.dat]

# The author's copy states a licence but is older than the CDS files.
- key: van-den-bosch-2016-repository
  title: Black-Hole-Mass-compilation, the data table and code of van den Bosch 2016
  reference: van den Bosch 2016, ApJ 831, 134
  license: >-
    MIT, with one added line: "And please cite my paper associated with this
    code and datatable."
  terms_url: https://github.com/remco-space/Black-Hole-Mass-compilation/blob/master/LICENSE
  distribution: open
  urls:
  - url: https://codeload.github.com/remco-space/Black-Hole-Mass-compilation/tar.gz/refs/heads/master
    name: Black-Hole-Mass-compilation-master.tar.gz

- key: bass-dr2
  title: BASS. XXII. The BASS DR2 AGN catalog and data
  reference: Koss et al. 2022, ApJS 261, 2
  license: None stated. The article is CC BY 4.0.
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/ApJS/261/2/ReadMe
  distribution: undecided
  cds:
    catalogue: J/ApJS/261/2
    files: [table8.dat, table9.dat, table11.dat]

- key: agn-black-hole-mass-database
  title: The AGN Black Hole Mass Database
  reference: Bentz & Katz 2015, PASP 127, 67
  license: >-
    None stated. "Please cite the appropriate references for the reverberation
    campaigns and measurements. This database is simply a compilation, it does
    not supersede the original publications. However, if you have found this
    database useful, please cite the PASP article."
  terms_url: http://www.astro.gsu.edu/AGNmass/
  distribution: undecided
  refresh_days: 30
  urls:
  # The POST makes the CSV in a session, so it must come before the download.
  - url: http://www.astro.gsu.edu/AGNmass/
    name: agnmass.html
    method: POST
    data: {filetype: csv, submit: Create File}
  - url: http://www.astro.gsu.edu/AGNmass/download.php
    name: mbh.csv

- key: fortin-hmxb
  title: >-
    A catalogue of high-mass X-ray binaries in the Galaxy: from the INTEGRAL
    to the Gaia era
  reference: Fortin et al. 2023, A&A 671, A149
  license: >-
    "This website is licensed under a Creative Commons Attribution-ShareAlike
    4.0 International License." The catalogue carries Gaia DR3 data
    (CC BY-NC 3.0 IGO).
  terms_url: https://binary-revolution.github.io/HMXBwebcat/
  distribution: non-commercial
  refresh_days: 30
  urls:
  - https://binary-revolution.github.io/HMXBwebcat/downloads/HMXBwebcat_latest.csv
  - https://binary-revolution.github.io/HMXBwebcat/notes.html

- key: fortin-lmxb
