- key: xrbcats
  title: "XRBcats: Galactic high-mass and low-mass X-ray binary catalogues"
  reference: Neumann et al. 2023, A&A 677, A134; Avakyan et al. 2023, A&A 675, A199
  license: >-
    None stated. "You are free to use the information in these catalogues in
    publications, however, we ask that you please cite the published paper
    (HMXB: Neumann et al 2023, LMXB: Avakyan et al 2023) and refer to the url
    http://astro.uni-tuebingen.de/~xrbcat/ in either the acknowledgements or a
    footnote." The articles are CC BY 4.0. The catalogues carry Gaia DR3 data
    (CC BY-NC 3.0 IGO).
  terms_url: http://astro.uni-tuebingen.de/~xrbcat/
  distribution: undecided
  urls:
  # Each path names one release, so a newer release needs a new URL.
  - http://astro.uni-tuebingen.de/~xrbcat/HMXBcat/March2025/HMXBcat.fits
  - http://astro.uni-tuebingen.de/~xrbcat/LMXBcat/january_24/LMXBcat.fits
  - http://astro.uni-tuebingen.de/~xrbcat/Updates.html

