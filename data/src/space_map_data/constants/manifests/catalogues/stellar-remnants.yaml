    None stated. "If you want to use any data in this page for scientific
    research or scientific propagation, please do cite properly to" the GPPS
    papers that the page lists.
  terms_url: http://zmtt.bao.ac.cn/GPPS/GPPSnewPSR.html
  distribution: undecided
  refresh_days: 30
  urls:
  - http://zmtt.bao.ac.cn/GPPS/GPPSnewPSR.html

