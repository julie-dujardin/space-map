# Pulsars, neutron stars and white dwarfs.
# `constants/manifests/catalogues.py` describes the fields.
catalogues:
- key: atnf-psrcat
  title: ATNF Pulsar Catalogue
  reference: Manchester et al. 2005, AJ 129, 1993
  license: >-
    Two statements. The download page, on the program: "PSRCAT is free
    software: you can redistribute it and/or modify it under the terms of the
    GNU General Public License as published by the Free Software Foundation,
    either version 3 of the License, or (at your option) any later version."
    The same page: "The programs and databases remain the property of the
    Australia Telescope National Facility, CSIRO". The CSIRO Data Access
    Portal collection of the same catalogue (https://doi.org/10.25919/mjwb-7w32):
    licence "BSD 3-Clause Licence", rights "All Rights (including copyright)
    CSIRO 2025.", and a bundled OSS_LICENSE.txt headed "CSIRO Open Source
    Software Licence v1.0 (Based on MIT/BSD Open Source Licence)". Credit
    asked: "we would appreciate acknowledgement by reference to the
    publication "The ATNF Pulsar Catalogue", R. N. Manchester, G. B. Hobbs,
    A. Teoh & M. Hobbs, Astronomical Journal, 129, 1993-2006 (2005) and by
    quoting the web address https://www.atnf.csiro.au/research/pulsar/psrcat".
  terms_url: https://www.atnf.csiro.au/research/pulsar/psrcat/download.html
  distribution: undecided
  refresh_days: 30
  urls:
  - https://www.atnf.csiro.au/research/pulsar/psrcat/downloads/psrcat_pkg.tar.gz

- key: freire-gc-pulsars
  title: Pulsars in globular clusters
  reference: P. C. C. Freire, web list, Max-Planck-Institut für Radioastronomie
  license: >-
    None stated. "I give relevant references on each pulsar whenever they are
    available, please cite these if possible."
  terms_url: https://www3.mpifr-bonn.mpg.de/staff/pfreire/GCpsr.html
  distribution: undecided
  refresh_days: 30
  urls:
  - https://www3.mpifr-bonn.mpg.de/staff/pfreire/GCpsr.txt
  - https://www3.mpifr-bonn.mpg.de/staff/pfreire/GCpsr.html

- key: fast-gpps
  title: Newly discovered pulsars from the FAST Galactic Plane Pulsar Snapshot survey
  reference: Han et al. 2021, RAA 21, 107
