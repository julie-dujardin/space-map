# Star clusters, associations, stellar streams, and the structure of the Milky Way.
# `constants/manifests/catalogues.py` describes the fields.
catalogues:
- key: hunt-reffert-2024
  title: Improving the open cluster census. III. Masses, sizes and classes
  reference: Hunt & Reffert 2024, A&A 686, A42
  license: None stated. The article is CC BY 4.0. Derived from Gaia DR3 (CC BY-NC 3.0 IGO).
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/A+A/686/A42/ReadMe
  distribution: undecided
  cds:
    catalogue: J/A+A/686/A42
    files: [clusters.dat.gz, members.dat.gz, crossma.dat.gz]

- key: ucc
  title: The Unified Cluster Catalogue, version 260615
  reference: Perren et al. 2023, MNRAS 526, 4107
  license: CC BY 4.0. Derived from Gaia DR3 (CC BY-NC 3.0 IGO).
  terms_url: https://zenodo.org/records/20705026
  distribution: non-commercial
  zenodo:
    record: 20705026

- key: harris-2010
  title: Catalog of Parameters for Milky Way Globular Clusters, 2010 edition
  reference: Harris 1996, AJ 112, 1487 (2010 edition)
  license: >-
    None stated. "supplied free of charge", "must refer to the original
    source", "without charge of any fee".
  terms_url: https://physics.mcmaster.ca/~harris/mwgc.dat
  distribution: undecided
  urls:
  - https://physics.mcmaster.ca/~harris/mwgc.dat

- key: vasiliev-baumgardt-2021
  title: Gaia EDR3 view on Galactic globular clusters, membership probabilities
  reference: Vasiliev & Baumgardt 2021, MNRAS 505, 5978
  license: CC BY 4.0. Derived from Gaia EDR3 (CC BY-NC 3.0 IGO).
  terms_url: https://zenodo.org/records/4891252
  distribution: non-commercial
  zenodo:
    record: 4891252

- key: baumgardt-globular-clusters
  title: Fundamental parameters of Galactic globular clusters, 4th version
  reference: >-
    Baumgardt & Hilker 2018, MNRAS 478, 1520; Baumgardt & Vasiliev 2021,
    MNRAS 505, 5957
  license: >-
    None stated. "(C) Holger Baumgardt, Antonio Sollima, Michael Hilker,
    Andrea Bellini, Eugene Vasiliev, Vincent Henault-Brunet & Nolan Dickson,
    March 2023". "If you use these profiles for your research, please give
    reference to the papers." The proper motions are from Gaia EDR3
    (CC BY-NC 3.0 IGO).
  terms_url: https://people.smp.uq.edu.au/HolgerBaumgardt/globular/
  distribution: undecided
  refresh_days: 30
  urls:
  - https://people.smp.uq.edu.au/HolgerBaumgardt/globular/orbits_table.txt
  - https://people.smp.uq.edu.au/HolgerBaumgardt/globular/combined_table.txt
  - url: https://people.smp.uq.edu.au/HolgerBaumgardt/globular/lgclusters/combined_table.txt
    name: lgclusters_combined_table.txt
  - https://people.smp.uq.edu.au/HolgerBaumgardt/globular/rv.dat
  - url: https://people.smp.uq.edu.au/HolgerBaumgardt/globular/appendix/combined_table.txt
    name: appendix_combined_table.txt

- key: bica-2008
  title: A general catalogue of extended objects in the Magellanic System
  reference: Bica et al. 2008, MNRAS 389, 678
  license: None stated.
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/MNRAS/389/678/ReadMe
  distribution: undecided
  cds:
    catalogue: J/MNRAS/389/678
    files: [table3.dat, table4.dat, table5.dat, table6.dat]

- key: bica-2020
  title: >-
    An updated Small Magellanic Cloud and Magellanic Bridge catalog of star
