  terms_url: https://zenodo.org/records/18166118
  distribution: non-commercial
  zenodo:
    record: 18166118
    files: [moca_tables.zip, summary_tables.zip]

- key: quintana-2026
  title: A new Gaia census of OB associations within 1 kpc
  reference: Quintana et al. 2026, MNRAS 549, stag853
  license: '"License: CC-BY-4.0". Derived from Gaia DR3 (CC BY-NC 3.0 IGO).'
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/MNRAS/549/G853/ReadMe
  distribution: non-commercial
  cds:
    catalogue: J/MNRAS/549/G853
    files: [table1.dat, members.dat.gz, rejected.dat]

- key: wright-2020
  title: OB Associations and their origins, census of known OB associations
  reference: Wright 2020, New Astronomy Reviews 90, 101549
  license: None stated.
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/other/NewAR/90.1549/ReadMe
