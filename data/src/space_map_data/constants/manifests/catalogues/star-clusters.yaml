  - http://www.bo.astro.it/M31/RBC_SP12_V5.tab
  - http://www.bo.astro.it/M31/RBC_sdss12_V5.tab
  - http://www.bo.astro.it/M31/M31GC_Fe.tab
  - http://www.bo.astro.it/M31/M31GCindex.tab
  - http://www.bo.astro.it/M31/MWGC_ind.tab
  - http://www.bo.astro.it/M31/refsV5.tab
