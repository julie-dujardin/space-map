  reference: Bica et al. 2020, AJ 159, 82
  license: None stated.
  terms_url: https://cdsarc.cds.unistra.fr/ftp/J/AJ/159/82/ReadMe
  distribution: undecided
  cds:
    catalogue: J/AJ/159/82
    files: [table2.dat, table4.dat, refs.dat]

- key: bologna-rbc-v5
