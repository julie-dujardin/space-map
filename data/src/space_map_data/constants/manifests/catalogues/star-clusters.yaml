- key: ibata-2024
  title: STREAMFINDER atlas of stellar streams detected in Gaia DR3
  reference: Ibata et al. 2024, ApJ 967, 89
  license: None stated. The article is CC BY 4.0. Derived from Gaia DR3 (CC BY-NC 3.0 IGO).
  terms_url: https://doi.org/10.3847/1538-4357/ad382d
  distribution: undecided
  urls:
  - https://content.cld.iop.org/journals/0004-637X/967/2/89/revision1/apjad382dt1_mrt.txt
