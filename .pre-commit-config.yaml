repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        files: ^data/
        name: ruff check (data)
      - id: ruff-format
        files: ^data/
        name: ruff format (data)

  - repo: local
    hooks:
      - id: ty
        name: ty check (data)
        entry: bash -c 'cd data && uv run ty check .'
        language: system
        pass_filenames: false
        files: ^data/

      - id: lint-frontend
        name: lint (frontend)
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: format-frontend
        name: format check (frontend)
        entry: bash -c 'cd frontend && pnpm format'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: build-frontend
        name: build (frontend)
        entry: bash -c 'cd frontend && pnpm build'
        language: system
        pass_filenames: false
        files: ^frontend/
