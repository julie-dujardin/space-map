repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        files: ^data/
        name: ruff check (data)
        args: [ --fix ]
      - id: ruff-format
        files: ^data/
        name: ruff format (data)

  - repo: local
    hooks:
      - id: ty
        name: ty check (data)
        entry: bash -c 'cd data && uv run ty check .'
        language: system
        pass_filenames: false
        files: ^data/

      - id: lint-frontend
        name: lint (frontend)
        entry: bash -c 'cd frontend && pnpm lint --fix'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: core-boundary-frontend
        name: core boundary (frontend)
        entry: bash -c 'cd frontend && pnpm check:core'
        language: system
        pass_filenames: false
        files: ^frontend/src/
      - id: format-frontend
        name: format check (frontend)
        entry: bash -c 'cd frontend && pnpm format'
        language: system
        pass_filenames: false
        files: ^frontend/

      # Writes the SDK's API report from the code. If the report changes, the
      # commit stops until the report is staged.
      - id: api-report-frontend
        name: API report (frontend)
        entry: bash -c 'cd frontend && pnpm api-report'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: build-frontend
        name: build (frontend)
        entry: bash -c 'cd frontend && pnpm build'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [manual]
