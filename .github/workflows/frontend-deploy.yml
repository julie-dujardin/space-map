name: frontend-deploy

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-deploy.yml
      - .github/workflows/frontend-test.yml
  workflow_dispatch:

# A deploy must run to completion, so later pushes queue behind it.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  # Only main deploys. A dispatch from another branch skips the gates, and so
  # the deploy.
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/frontend-test.yml
    permissions:
      contents: read

  precommit:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    needs: [test, precommit]
    runs-on: ubuntu-latest
    environment: cf-pages-deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # PUBLIC_* env is runtime-only ($env/dynamic/public), set on the Worker
      # in the CF dashboard.
      - name: Build
        run: cd frontend && pnpm build

      # The SEO page records of the live export, into the Worker's assets.
      - name: SEO page records
        run: cd frontend && pnpm build:seo

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # Before 4.42.1, a version upload drops the dashboard variables.
          wranglerVersion: '4.148.0'
          command: deploy

      - name: Verify deployment
        env:
          # spacemap.co checks that prod routing picked it up.
          URLS: >-
            ${{ steps.deploy.outputs.deployment-url }}
            https://spacemap.co
        run: |
          for url in $URLS; do
            echo "Probing $url"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$url" | grep -q '</html>'
          done
