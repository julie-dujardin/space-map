name: backend-test

on:
  push:
    branches: [main]
  pull_request:
    paths: [data/**]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: data/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: cd data && uv sync --locked --dev

      - name: Run tests
        run: cd data && uv run pytest
