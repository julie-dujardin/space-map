name: backend-test

# Standalone check on PRs; called by data-deploy to gate deploys that ship.
on:
  workflow_call:
  pull_request:
    paths:
      - data/**
      - .github/workflows/backend-test.yml

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: data/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: cd data && uv sync --locked --dev

      # The suite takes a few minutes; past ten, a test is doing heavy work.
      # The durations name the slowest tests.
      - name: Run tests
        timeout-minutes: 10
        run: cd data && uv run pytest -n auto --durations=20
