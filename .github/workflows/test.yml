name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: data/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install data dev dependencies
        run: cd data && uv sync --locked --dev

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - uses: pre-commit/action@v3.0.1
        env:
          PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL }}
          PUBLIC_MEILI_URL: ${{ vars.PUBLIC_MEILI_URL }}
          PUBLIC_MEILI_SEARCH_KEY: ${{ vars.PUBLIC_MEILI_SEARCH_KEY }}
        with:
          extra_args: --all-files --hook-stage manual
