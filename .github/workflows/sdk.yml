name: sdk

# Standalone check on PRs; a tag is what publishes. The package carries the CDN
# copies, so jsDelivr is the CDN and npm the only publish.
on:
  workflow_call:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/sdk.yml
  push:
    tags:
      - sdk-v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      # src/lib/fetch/position/labels.ts reads the compiled messages, and they
      # are generated rather than committed.
      - name: Compile paraglide messages
        run: cd frontend && npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      # Builds the CDN copies (with the gzip budget) and the package around them.
      - name: Build and check the package
        run: cd frontend && pnpm test:sdk

      # A tag that disagrees with the manifest would publish a version nobody
      # can find from the repo, and the number cannot be reused.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          version=$(node -p "require('./frontend/dist/sdk-npm/package.json').version")
          tagged="${GITHUB_REF_NAME#sdk-v}"
          [[ "$version" == "$tagged" ]] \
            || { echo "ERROR: tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-npm
          path: frontend/dist/sdk-npm
          if-no-files-found: error

      # What the release page carries: the CDN copies with the sourcemaps the
      # package leaves out, and the notices that go with them.
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-release
          path: |
            frontend/dist/sdk/spacemap.js
            frontend/dist/sdk/spacemap.js.map
            frontend/dist/sdk/spacemap.iife.js
            frontend/dist/sdk/spacemap.iife.js.map
            frontend/dist/sdk/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Trusted publishing: npm takes an OIDC token instead of a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: frontend/.node-version
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version

      # Staged publishing needs a newer npm 11 than Node ships. Pinned to the
      # major: npm 12 refuses the Node in .node-version.
      - name: Update npm
        run: npm install -g npm@11

      - uses: actions/download-artifact@v8
        with:
          name: sdk-npm
          path: sdk-npm

      # Staged: the version goes live once approved with 2FA, on npmjs.com or
      # with `npm stage approve`. The trusted publisher allows nothing else.
      - name: Stage the publish
        run: cd sdk-npm && npm stage publish --access public --provenance

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk-release
          path: sdk-release

      # Its own track next to the data releases (`v*`): notes start at the
      # previous SDK tag, not the last data tag, and the repo's "Latest"
      # badge stays with the data track.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/sdk-v" \
            --jq '.[].ref | ltrimstr("refs/tags/")' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1)
          gh release create "$GITHUB_REF_NAME" sdk-release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "spacemap $version" \
            --generate-notes ${previous:+--notes-start-tag "$previous"} \
            --notes "npm: \`spacemap@$version\` (staged; live once approved). CDN: https://cdn.jsdelivr.net/npm/spacemap@$version/dist/spacemap.js"
