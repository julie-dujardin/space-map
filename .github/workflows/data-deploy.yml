name: data-deploy

on:
  push:
    branches: [main]
    paths:
      - data/**
      - infrastructure/data/**
      - .github/workflows/data-deploy.yml
  pull_request:
    paths:
      - data/**
      - infrastructure/data/**
      - .github/workflows/data-deploy.yml

concurrency:
  group: data-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create release + tag
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Read project version from pyproject.toml
        id: pyproject
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('data/pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/space-map-data
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.pyproject.outputs.version }},enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/data/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if release already exists
        id: release_check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.pyproject.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: github.event_name == 'push' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pyproject.outputs.version }}
          name: v${{ steps.pyproject.outputs.version }}
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/space-map-data:${{ steps.pyproject.outputs.version }}`
