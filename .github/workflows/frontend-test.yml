name: frontend-test

on:
  push:
    branches: [main]
  pull_request:
    paths: [frontend/**]

jobs:
  vitest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Type-check
        # $env/static types only generate when these PUBLIC_ vars are defined
        # (empty ok); paraglide messages are compiled in the step below.
        env:
          PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL }}
          PUBLIC_MEILI_URL: ${{ vars.PUBLIC_MEILI_URL }}
          PUBLIC_MEILI_SEARCH_KEY: ${{ vars.PUBLIC_MEILI_SEARCH_KEY }}
        run: |
          cd frontend
          npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
          pnpm check

      - name: Run tests
        run: cd frontend && npx vitest run
